# Served by the origin nginx behind the existing SafeLine site. No WAF exception.
location = /api/v2/safeline-verify {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; frame-ancestors https://sevtinge.com" always;
    return 200 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>安全验证</title><body><p>验证已完成，正在返回博客…</p><script>(function(){var cookies=document.cookie.split(";").map(function(x){return x.trim()}).filter(function(x){return x.indexOf("sl-challenge-jwt=")===0});var message={type:"shiro:safeline-verified",cookies:cookies};if(window.parent!==window)window.parent.postMessage(message,"https://sevtinge.com");if(window.opener)window.opener.postMessage(message,"https://sevtinge.com")})()</script></body></html>';
}
